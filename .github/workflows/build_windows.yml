name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # lets you also trigger it manually from the GitHub website

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller pandas openpyxl

      - name: Build EXE
        run: |
          pyinstaller --onefile --name automate_report --console automate_report.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: automate_report_windows
          path: dist\automate_report.exe
          retention-days: 30
